# CSE335 Requirement 2 - configurable paging experiment
#
# The simulated address must be split exactly into hierarchy bits and offset:
# sum(level_bits) + log2(page_size) = address_bits.

address_bits=32
page_size=4096
levels=2
level_bits=10,10

frames=64
algorithm=BOTH

# trace_mode may be sequential, locality, random, or file.
trace_mode=locality
references=10000
working_set_bytes=1048576
hot_bytes=131072
access_stride=64
seed=335

# Required only when trace_mode=file. Addresses may be decimal or hexadecimal.
trace_file=/usr/tests/paging.trace
csv_output=/tmp/vmexperiment.csv
